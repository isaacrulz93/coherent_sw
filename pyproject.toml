[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coherent-slicing"
version = "0.1.0"
description = "Metric-preserving adaptive sliced-Wasserstein aggregations"
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

